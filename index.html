<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-card">

        <div class="top-section">

            <div class="top-badge">
                Word Puzzle
            </div>

            <button id="hintBtn">Hint</button>
        </div>

        <h1>Word Scramble</h1>

        <p class="subtitle">
            Unscramble the hidden word
        </p>

        <div class="timer-box">
            Time Left: <span id="timer">20</span>s
        </div>

        <div class="word-box">
            RACETSIPVJA
        </div>

        <div class="hint-text">
            Hint: ---
        </div>

        <input
            type="text" id="guessInput" placeholder="Enter correct word"
        >

        <div class="button-group">

            <button id="checkBtn">Check Answer</button>
            <button id="nextBtn">Next Word</button>
        </div>

        <button id="restartBtn">Restart Game</button>

        <div class="message">
            Start guessing...
        </div>

        <div class="stats">

            <div class="score">
                Score: 0
            </div>

            <div class="lives">
                Lives: 3
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
