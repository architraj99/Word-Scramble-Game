<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-card">

        <div class="top-badge">
            Word Puzzle
        </div>

        <h1>Word Scramble</h1>

        <p class="subtitle">Unscramble the hidden word</p>

        <div class="word-box">RACETSIPVJA</div>

        <input type="text" id="guessInput" placeholder="Enter correct word">

        <div class="button-group">

            <button id="checkBtn">Check Answer</button>
            <button id="nextBtn">Next Word</button>

        </div>

        <div class="message">Start Guessing...</div>

        <div class="stats">

            <div class="score">
                Score: 0
            </div>

            <div class="lives">Lives: 3</div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
