<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-card">

        <div class="game-name">
            Word Game
        </div>

        <h1>Word Scramble Game</h1>

        <p class="subtitle">
            Unscramble the word.
        </p>

        <div class="settings">

            <select id="difficulty">
                <option value="20">Easy</option>
                <option value="15" selected>Medium</option>
                <option value="10">Hard</option>
            </select>

            <select id="category">
                <option value="tech">Tech</option>
                <option value="gaming">Gaming</option>
                <option value="space">Space</option>
            </select>

        </div>

        <div class="timer-box">
            Time Left:
            <span id="timer">15</span>
            seconds
        </div>

        <div class="word-box">
            RACETSIPVJA
        </div>

        <div class="hint-text">
            Hint: ---
        </div>

        <input
            type="text"
            id="guessInput"
            placeholder="Enter word"
        >

        <div class="button-group">

            <button id="checkBtn">
                Check
            </button>

            <button id="nextBtn">
                Next
            </button>

        </div>

        <button id="hintBtn">
            Show Hint
        </button>

        <button id="restartBtn">
            Restart
        </button>

        <div class="message">
            Start guessing...
        </div>

        <div class="stats">

            <div class="score">
                Score: 0
            </div>

            <div class="lives">
                Lives: 3
            </div>

            <div class="best-score">
                Best: 0
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
